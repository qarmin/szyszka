[workspace]

[package]
name = "szyszka"
version = "3.0.0"
authors = ["Rafał Mikrut <mikrutrafal@protonmail.com>"]
edition = "2021"
description = "Fast, powerful and easy to use file renamer (Slint port)"
license = "MIT"
homepage = "https://github.com/qarmin/szyszka"
repository = "https://github.com/qarmin/szyszka"
rust-version = "1.92.0"
build = "build.rs"

[dependencies]
slint = { version = "1.13", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg"] }

directories-next = "2.0.0"
rayon = "1.8.1"
jwalk = "0.8.1"

humansize = "2.1"
chrono = "0.4.33"

open = "5.0"

slugmin = "1.0"

regex = "1.10"

natord = "1.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

rfd = "0.15"

i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8.2"
once_cell = "1.19"

[build-dependencies]
slint-build = "1.13"

[profile.dev.package."*"]
opt-level = 3
